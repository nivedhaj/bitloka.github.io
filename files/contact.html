		<script type="text/javascript">
			function sendRequest() {
				var name = document.getElementById("contactName").value;
				var mobile = document.getElementById("contactMobile").value;
				var email = document.getElementById("contactEmail").value;
				var message = document.getElementById("contactMsg").value;
	
				var payload = {
					Name: name,
					Email: email,
					Mobile: mobile,
					Message: message
				}
	
				fetch("https://prod.campustrack.net/api/auth/anon/contact", {
					method: "POST",
					body: JSON.stringify(payload),
					headers: {
						"Accesscode": "00ed8512-2b45-4853-a962-d2423ef61fb1",
						"Content-type": "application/json",
					},
				}).then((response) => response.json());
	
				var win = window.open('about:blank', '_blank');
				var doc = win.document;
				doc.write('Thank you for your interest! We will get in touch with you shortly');
			}
		</script>
